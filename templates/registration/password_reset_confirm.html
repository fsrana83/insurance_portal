{% extends "base.html" %}{% block title %}New password{% endblock %}
{% block anon %}<div class="login__form" style="min-height:100vh">{% if validlink %}<form method="post">{% csrf_token %}<h2 style="margin-bottom:14px">Choose a new password</h2>{{ form.as_p }}<button class="btn" type="submit">Save password</button></form>{% else %}<div><h2>This link has expired</h2><p>Request a new reset link.</p><a class="btn" href="{% url 'password_reset' %}">Request link</a></div>{% endif %}</div>{% endblock %}
