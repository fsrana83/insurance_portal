{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block anon %}<div class="login"><section class="login__art"><strong>Advance Motor Insurance Solution</strong><h1>Reset your password</h1><p>Enter your email and we will send a reset link.</p><span></span></section>
<section class="login__form"><form method="post">{% csrf_token %}<div class="field"><label for="id_email">Email</label><input class="input" id="id_email" type="email" name="email" required autofocus></div><button class="btn" type="submit">Send reset link</button><p><a href="{% url 'login' %}">Back to sign in</a></p></form></section></div>{% endblock %}
