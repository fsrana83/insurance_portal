<label class="rider-chip" for="{{ widget.attrs.id }}" data-mandatory-for="{{ widget.mandatory_for }}" data-regulatory="{{ widget.regulatory }}"><input type="checkbox" name="{{ widget.name }}" value="{{ widget.value|stringformat:'s' }}"{% include "django/forms/widgets/attrs.html" %}><span class="rider-chip__face"><span class="rider-chip__tick" aria-hidden="true"></span><span class="rider-chip__text"><strong>{{ widget.label }}</strong><small>{{ widget.hint }}</small></span><em class="rider-chip__tag"></em></span></label>
